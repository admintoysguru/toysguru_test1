<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>ToysGuru.in — Welcome</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --red:#e0001b;
  --gold:#cfa84b;
  --bg:#050505;
  --text:#f4f1eb;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:#000;
  font-family:'Syne',sans-serif;
  color:var(--text);
}

/* BACKGROUND */

.bg{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at top left, rgba(224,0,27,0.18), transparent 30%),
    radial-gradient(circle at bottom right, rgba(207,168,75,0.12), transparent 30%),
    #000;
  overflow:hidden;
}

.bg::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.02),
      rgba(255,255,255,0.02) 1px,
      transparent 1px,
      transparent 4px
    );
  opacity:0.3;
}

/* PARTICLES */

.particle{
  position:absolute;
  width:3px;
  height:3px;
  background:rgba(255,255,255,0.6);
  border-radius:50%;
  animation:float 12s linear infinite;
}

@keyframes float{
  from{
    transform:translateY(100vh);
    opacity:0;
  }
  10%{
    opacity:1;
  }
  to{
    transform:translateY(-100vh);
    opacity:0;
  }
}

/* CENTER AREA */

.center-wrap{
  position:relative;
  z-index:2;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:20px;
}

/* HOT WHEELS */

.hw-logo{
  width:460px;
  max-width:85vw;
  margin-bottom:25px;
  animation:logoEnter 2s ease forwards;
  filter:
    drop-shadow(0 0 40px rgba(255,80,0,0.55))
    drop-shadow(0 0 80px rgba(255,80,0,0.2));
}
@keyframes logoEnter{
  from{
    transform:translateX(-140vw);
    opacity:0;
  }
  to{
    transform:translateX(0);
    opacity:1;
  }
}

/* TOYS */

.toy{
  position:absolute;
  width:220px;
  object-fit:contain;
  opacity:0;
  filter:
    drop-shadow(0 0 25px rgba(255,255,255,0.08))
    drop-shadow(0 0 40px rgba(224,0,27,0.12));
}

.toy1{
  left:-500px;
  bottom:10%;
  animation:toy1 2.8s ease forwards;
}

.toy2{
  right:4%;
  top:5%;
  width:240px;
  animation:toy2 3s ease forwards;
  filter:
    drop-shadow(0 0 20px rgba(255,180,255,0.25))
    drop-shadow(0 0 50px rgba(255,180,255,0.12));
}
.toy3{
  right:-220px;
  bottom:14%;
  animation:toy3 3.2s ease forwards;
}
.toy4{
  left:-40px;
  top:18%;
  width:500px;
  animation:toy4 3.5s ease forwards;

  filter:
    drop-shadow(0 0 25px rgba(255,120,0,0.35))
    drop-shadow(0 0 60px rgba(255,80,0,0.18));
}
.hotwheels-logo{
  position:absolute;
  width:520px;
  top:-120px;
  left:50%;
  transform:translateX(-50%);
  opacity:0;
  z-index:5;
  animation:hotwheelsEntry 2.5s ease forwards;
  filter:
    drop-shadow(0 0 25px rgba(255,80,0,0.5))
    drop-shadow(0 0 60px rgba(255,0,0,0.25));
}
@keyframes toy1{
  to{
    left:7%;
    opacity:1;
  }
}

@keyframes toy2{
  to{
    right:7%;
    opacity:1;
  }
}

@keyframes toy3{
  to{
    right:15%;
    opacity:1;
  }
}
@keyframes toy4{
  to{
    left:10%;
    opacity:1;
  }
}

  @keyframes hotwheelsEntry{
  from{
    top:-220px;
    opacity:0;
    transform:translateX(-50%) scale(0.7);
  }

  to{
    top:30px;
    opacity:1;
    transform:translateX(-50%) scale(1);
  }
}
/* TITLE */

.title{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(58px,10vw,140px);
  font-weight:900;
  letter-spacing:6px;
  line-height:1;
  opacity:0;
  animation:titleReveal 2s 1s forwards;
  text-transform:uppercase;
  background:linear-gradient(to bottom,#ffffff,#d7b45f);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:
    0 0 20px rgba(255,255,255,0.15),
    0 0 50px rgba(224,0,27,0.15);
}

@keyframes titleReveal{
  from{
    opacity:0;
    transform:translateY(40px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.subtitle{
  margin-top:18px;
  color:rgba(255,255,255,0.7);
  letter-spacing:4px;
  font-size:13px;
  text-transform:uppercase;
  opacity:0;
  animation:fadeIn 2s 1.6s forwards;
}

@keyframes fadeIn{
  to{
    opacity:1;
  }
}

/* BUTTON */

.enter-btn{
  margin-top:50px;
  padding:18px 48px;
  background:linear-gradient(135deg,var(--red),#8f0011);
  border:none;
  color:#fff;
  font-family:'Orbitron',sans-serif;
  font-size:13px;
  letter-spacing:3px;
  cursor:pointer;
  text-transform:uppercase;
  transition:0.3s;
  opacity:0;
  animation:fadeIn 2s 2.2s forwards;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
}

.enter-btn:hover{
  transform:translateY(-3px);
  box-shadow:
    0 0 25px rgba(224,0,27,0.5),
    0 0 60px rgba(224,0,27,0.2);
}

/* LOGIN MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  backdrop-filter:blur(12px);
}

.modal-box{
  width:90%;
  max-width:420px;
  background:#090909;
  border:1px solid rgba(207,168,75,0.25);
  padding:40px;
  position:relative;
  animation:modalIn 0.4s ease;
}

@keyframes modalIn{
  from{
    transform:translateY(30px);
    opacity:0;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}

.modal-box h2{
  font-family:'Orbitron',sans-serif;
  margin-bottom:10px;
  font-size:24px;
}

.modal-box p{
  color:rgba(255,255,255,0.55);
  margin-bottom:30px;
  font-size:14px;
}

.input{
  width:100%;
  margin-bottom:16px;
  background:#121212;
  border:1px solid rgba(255,255,255,0.06);
  padding:14px;
  color:#fff;
  outline:none;
  font-family:'Syne',sans-serif;
}

.input:focus{
  border-color:var(--gold);
}

.login-btn{
  width:100%;
  padding:14px;
  background:var(--gold);
  border:none;
  color:#111;
  font-family:'Orbitron',sans-serif;
  font-weight:700;
  cursor:pointer;
  letter-spacing:2px;
  margin-top:10px;
}

.close{
  position:absolute;
  top:12px;
  right:14px;
  cursor:pointer;
  color:#999;
  font-size:22px;
}

@media(max-width:900px){

  .toy{
    width:110px;
    opacity:0.5;
  }

}

</style>
</head>

<body>

<div class="bg">

  <div class="particle" style="left:10%; animation-delay:0s;"></div>
  <div class="particle" style="left:20%; animation-delay:2s;"></div>
  <div class="particle" style="left:30%; animation-delay:4s;"></div>
  <div class="particle" style="left:40%; animation-delay:1s;"></div>
  <div class="particle" style="left:50%; animation-delay:3s;"></div>
  <div class="particle" style="left:60%; animation-delay:5s;"></div>
  <div class="particle" style="left:70%; animation-delay:2s;"></div>
  <div class="particle" style="left:80%; animation-delay:6s;"></div>

</div>

<!-- TOYS -->

<!-- TOYS -->

<img class="hotwheels-logo" src="Hotwheels.png">

<img class="toy toy2" src="cute unicorn plush.png">

<img class="toy toy3" src="Robot.png">

<img class="toy toy4" src="monster truck.png">


<!-- CENTER -->

<div class="center-wrap">

  <img
    class="hw-logo"
    src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/Hot_Wheels_logo.svg/2560px-Hot_Wheels_logo.svg.png"
  >

  <div class="title">
    ToysGuru
  </div>

  <div class="subtitle">
    Rare Toys • Serious Collectors
  </div>

  <button class="enter-btn" onclick="openModal()">
    Enter Garage
  </button>

</div>

<!-- LOGIN MODAL -->

<div class="modal" id="loginModal">

  <div class="modal-box">

    <div class="close" onclick="closeModal()">×</div>

    <h2>Garage Access</h2>

    <p>
      Enter your credentials to access the private collector marketplace.
    </p>

    <input class="input" type="text" id="email" placeholder="Email">

    <input class="input" type="password" id="password" placeholder="Password">

    <button class="login-btn" onclick="login()">
      Login
    </button>

  </div>

</div>

<script>

function openModal(){
  document.getElementById('loginModal').style.display='flex';
}

function closeModal(){
  document.getElementById('loginModal').style.display='none';
}

function login(){

  const email=document.getElementById('email').value;
  const password=document.getElementById('password').value;

  if(email==="admin" && password==="1234"){

    window.location.href="marketplace.html";

  }else{

    alert("Invalid Credentials");

  }

}

</script>

</body>
</html>
