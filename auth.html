<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enter the Vault | ToysGuru</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="gateWrap">

    <a class="gateLogo" href="index.html">Toys<em>Guru</em></a>

    <div class="gateCard">

        <div class="gateTabs">
            <button class="gateTab" data-tab="login">Login</button>
            <button class="gateTab" data-tab="signup">Sign Up</button>
        </div>

        <!-- LOGIN -->
        <form class="gateForm" data-form="login" id="loginForm">
            <div class="gateError"></div>
            <div id="accountAssistant" class="accountAssistant hidden">

    <h3 id="assistantTitle"></h3>

    <p id="assistantMessage"></p>

    <button
        type="button"
        id="assistantButton"
        class="assistantButton">
    </button>

</div>
            <div class="gRow">
                <label>Email</label>
                <input type="email" id="liEmail" placeholder="you@email.com" autocomplete="email">
            </div>
            <div class="gRow">
                <label>Password</label>
                <input type="password" id="liPassword" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" class="gateSubmit">Enter the vault</button>
        </form>

        <!-- SIGN UP -->
        <form class="gateForm" data-form="signup" id="signupForm">
            <div class="gateError"></div>
            <div class="gRow">
                <label>Full name</label>
                <input type="text" id="suName" placeholder="Your name" autocomplete="name">
            </div>
            <div class="gRow">
                <label>Email</label>
                <input type="email" id="suEmail" placeholder="you@email.com" autocomplete="email">
            </div>
            <div class="gRow">
                <label>Password</label>
                <input type="password" id="suPassword" placeholder="At least 6 characters" autocomplete="new-password">
            </div>
            <div class="gRow">
                <label>Confirm password</label>
                <input type="password" id="suConfirm" placeholder="••••••••" autocomplete="new-password">
            </div>
            <button type="submit" class="gateSubmit">Create account</button>
        </form>

    </div>

    <a class="gateBack" href="index.html">← Back to ToysGuru</a>

</div>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
<script src="firebaseClient.js"></script>
<script src="auth.js"></script>
</body>
</html>
