<span class="gateLogo">ToysGuru</span>
<span class="gateOwner">OWNER ACCESS</span>

<div class="gateCard">

    <form class="gateForm" id="adminLoginForm">
        <div class="gateError" id="adminError"></div>

        <div class="gRow">
            <label>Email</label>
            <input
                type="email"
                id="adEmail"
                placeholder="owner@toysguru.in"
                autocomplete="email"
            >
        </div>

        <div class="gRow">
            <label>Password</label>
            <input
                type="password"
                id="adPassword"
                placeholder="••••••••"
                autocomplete="current-password"
            >
        </div>

        <button type="submit" class="gateSubmit">
            Enter dashboard
        </button>
    </form>

    <div class="loginDivider">
        <span>OR</span>
    </div>

    <button type="button" class="googleAdminBtn" id="googleAdminBtn">
        Continue with Google
    </button>

</div>

<a class="gateBack" href="index.html">← Back to ToysGuru</a>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>

<script src="firebaseClient.js"></script>
<script src="admin-login.js"></script>

</body>
</html>
